<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Discover · Collectivize</title>
    <link rel="icon" href="../../app/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="discover.css">
    <link rel="stylesheet" href="event-actions.css">
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js"></script>
    <script src="shared.js" defer></script>
    <script src="add-to-calendar.js" defer></script>
    <script src="discover.js" defer></script>
</head>
<body>
    <main class="discover-page">
        <header class="dc-header">
            <div class="dc-heading">
                <h1 class="dc-title">Discover</h1>
                <p class="dc-subtitle">People, organizations and events on campus.</p>
            </div>
        </header>

        <form class="dc-search" id="search-form" role="search">
            <div class="dc-filter">
                <button type="button" class="dc-filter-button" id="filter-button"
                        aria-haspopup="true" aria-expanded="false" aria-controls="filter-panel">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.4V18l-3.6 2v-7.6z"/></svg>
                    <span class="dc-sr">Filters</span>
                    <span class="dc-filter-count" id="filter-count" hidden></span>
                </button>
                <div class="dc-filter-panel" id="filter-panel" hidden role="group" aria-label="Filters">
                    <fieldset class="dc-fieldset">
                        <legend>Show</legend>
                        <label><input type="checkbox" name="type" value="people"> People</label>
                        <label><input type="checkbox" name="type" value="orgs"> Organizations</label>
                        <label><input type="checkbox" name="type" value="events"> Events</label>
                    </fieldset>
                    <fieldset class="dc-fieldset">
                        <legend>Topics</legend>
                        <div class="dc-topic-boxes" id="topic-boxes"></div>
                    </fieldset>
                    <div class="dc-filter-actions">
                        <button type="button" class="dc-link-button" id="filter-clear">Clear</button>
                        <button type="button" class="dc-search-button" id="filter-done">Done</button>
                    </div>
                </div>
            </div>
            <div class="dc-datepick">
                <button type="button" class="dc-filter-button" id="date-button"
                        aria-haspopup="dialog" aria-expanded="false" aria-controls="date-panel">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/>
                        <path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>
                    </svg>
                    <span class="dc-sr" id="date-button-label">Date</span>
                    <span class="dc-filter-count" id="date-badge" hidden></span>
                </button>
                <div class="dc-cal-panel" id="date-panel" hidden role="dialog" aria-label="Choose a date">
                    <div class="dc-cal-head">
                        <button type="button" class="dc-cal-nav" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
                        <p class="dc-cal-month" id="cal-month" aria-live="polite"></p>
                        <button type="button" class="dc-cal-nav" id="cal-next" aria-label="Next month">&rsaquo;</button>
                    </div>
                    <div class="dc-cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
                    <div class="dc-cal-grid" id="cal-grid" role="grid"></div>
                    <div class="dc-cal-foot">
                        <button type="button" class="dc-link-button" id="cal-clear">Any date</button>
                        <button type="button" class="dc-link-button" id="cal-today">Today</button>
                    </div>
                </div>
            </div>
            <div class="dc-search-box">
                <label class="dc-sr" for="search-input">Search people, organizations and events</label>
                <svg class="dc-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
                </svg>
                <input type="search" id="search-input" maxlength="200" autocomplete="off"
                       placeholder="Search, or describe it: &ldquo;people into pottery&rdquo;">
            </div>
            <button type="submit" class="dc-search-button" id="search-button">Search</button>
        </form>

        <p class="dc-understood" id="understood" hidden aria-live="polite"></p>

        <p class="dc-status" id="status" role="status" aria-live="polite"></p>

        <ol class="dc-list" id="results" aria-label="Results"></ol>

        <nav class="dc-pages" id="pages" aria-label="Pages" hidden>
            <p class="dc-count" id="count"></p>
            <div class="dc-page-buttons" id="page-buttons"></div>
        </nav>
    </main>

    <template id="card-template">
        <li class="dc-card dc-event">
            <div class="dc-date" aria-hidden="true">
                <span class="dc-date-weekday"></span>
                <span class="dc-date-day"></span>
                <span class="dc-date-month"></span>
            </div>
            <div class="dc-body">
                <div class="dc-badges"></div>
                <h2 class="dc-card-title"></h2>
                <p class="dc-meta"></p>
                <p class="dc-host"></p>
                <p class="dc-description"></p>
                <ul class="dc-reasons" aria-label="Why this event"></ul>
                <div class="dc-friends" hidden>
                    <span class="dc-avatars" aria-hidden="true">
                        <span class="dc-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span>
                        <span class="dc-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span>
                        <span class="dc-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span>
                    </span>
                    <span class="dc-friends-text"></span>
                </div>
            </div>
            <div class="dc-actions"><span class="dc-actions-slot"></span></div>
        </li>
    </template>
</body>
</html>
