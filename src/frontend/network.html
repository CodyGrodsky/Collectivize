<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Network · Collectivize</title>
    <link rel="icon" href="../../app/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="network-graph.css">
    <link rel="stylesheet" href="profile-card.css">
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js"></script>
    <script src="shared.js" defer></script>
    <script src="profile-card.js" defer></script>
    <script src="network-graph.js" defer></script>
    <script src="network.js" defer></script>
</head>
<body>
    <main class="page">
        <h1 class="page-title">Network</h1>
        <p class="page-subtitle">You, your connections and your organizations. Drag to look around; tap someone for their card.</p>

        <section class="panel" aria-labelledby="invite-title">
            <div class="panel-head">
                <h2 class="panel-title" id="invite-title">Invite someone</h2>
                <button class="button" type="button" id="invite-button">Get an invite link</button>
            </div>
            <p class="muted" id="invite-help">They'll see your profile card and can join with their Northeastern email. Each link works once.</p>
            <div class="row" id="invite-link-row" hidden>
                <input class="input" id="invite-link" readonly aria-label="Invite link">
                <button class="button button-solid" type="button" id="invite-copy">Copy</button>
            </div>
        </section>

        <section class="panel" id="requests-panel" aria-labelledby="requests-title" hidden>
            <h2 class="panel-title" id="requests-title">Connection requests</h2>
            <p class="status" id="requests-status" role="status" aria-live="polite"></p>
            <ul class="list requests" id="requests"></ul>
        </section>

        <section class="panel" aria-label="Your network">
            <div id="graph"></div>
        </section>

        <section class="panel" id="sent-panel" aria-labelledby="sent-title" hidden>
            <h2 class="panel-title" id="sent-title">Requests you've sent</h2>
            <ul class="list" id="sent"></ul>
        </section>
    </main>
</body>
</html>
