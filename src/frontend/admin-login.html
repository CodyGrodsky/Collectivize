<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <meta name="robots" content="noindex">
    <title>Collectivize</title>
    <link rel="icon" href="../../app/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="landing.css">
    <script src="shared.js" defer></script>
    <script src="admin-login.js" defer></script>
</head>
<body>
    <main class="cover">
        <form class="signin" id="admin-signin" novalidate>
            <label class="signin-label" for="admin-username">Username</label>
            <input class="signin-input" id="admin-username" autocomplete="username" maxlength="64"
                   autocapitalize="none" spellcheck="false" required
                   style="width:100%;box-sizing:border-box">
            <label class="signin-label" for="admin-password" style="margin-top:12px">Password</label>
            <div class="signin-row">
                <input class="signin-input" id="admin-password" type="password" maxlength="200"
                       autocomplete="current-password" required aria-describedby="admin-message">
                <button class="signin-button" type="submit" id="admin-button">Sign in</button>
            </div>
            <p class="signin-message" id="admin-message" role="alert" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
