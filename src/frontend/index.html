<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Collectivize</title>
    <link rel="icon" href="../../app/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="logo-spin.css">
    <script src="shared.js" defer></script>
    <script src="landing.js" defer></script>
    <script type="module">
        import { initLogo3D } from "./logo3d.js";
        const box = document.getElementById("logo3d");
        initLogo3D({ container: box, logoSrc: "../../public/brand/logo.png" })
            .then(() => box.classList.add("is-3d"))
            .catch((error) => console.warn("3D logo unavailable; showing the image.", error));
    </script>
</head>
<body>
    <main class="cover">
        <div class="cover-hero" id="hero">
            <!-- The 3D dot logo (logo3d.js). The spinning image shows until it's ready,
                 and stays if WebGL or the three.js download isn't available. -->
            <div class="cover-logo3d" id="logo3d" role="img" aria-label="Collectivize logo">
                <img class="cover-logo logo-spin" src="../../public/brand/logo.svg" alt="" width="600" height="600">
            </div>
            <h1 class="cover-title">
                <img class="cover-wordmark" src="../../public/brand/wordmark-on-paper.svg" alt="Collectivize" width="1210" height="128">
            </h1>
        </div>

        <form class="signin" id="signin" novalidate>
            <label class="signin-label" for="signin-email">Northeastern email</label>
            <div class="signin-row">
                <input class="signin-input" id="signin-email" type="email" autocomplete="username"
                       inputmode="email" maxlength="254" required placeholder="you@northeastern.edu"
                       aria-describedby="signin-message">
                <button class="signin-button" type="submit" id="signin-button">Sign in</button>
            </div>
            <!-- Shown only after an admin account is typed above. -->
            <div class="signin-extra" id="signin-admin" hidden>
                <label class="signin-label" for="signin-password">Admin password</label>
                <input class="signin-input" id="signin-password" type="password" maxlength="200"
                       autocomplete="current-password" aria-describedby="signin-message">
                <div id="signin-duo" hidden>
                    <label class="signin-label" for="signin-passcode">Duo passcode</label>
                    <input class="signin-input" id="signin-passcode" inputmode="numeric" maxlength="20"
                           autocomplete="one-time-code" placeholder="from the Duo Mobile app"
                           aria-describedby="signin-message">
                </div>
            </div>
            <p class="signin-message" id="signin-message" role="alert" aria-live="polite"></p>
            <p class="signin-note">Campus-only for now. Demo accounts: <code>drew.demo@northeastern.edu</code>, <code>alice.demo@northeastern.edu</code>.</p>
        </form>
    </main>
</body>
</html>
