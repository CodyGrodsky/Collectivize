<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Profile · Collectivize</title>
    <link rel="icon" href="../../public/brand/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="network.css">
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js"></script>
    <script src="shared.js" defer></script>
    <script src="network-data.js" defer></script>
    <script src="profile-render.js" defer></script>
    <script src="profile-editor.js" defer></script>
    <script src="profile.js" defer></script>
</head>
<body>
    <main class="profile-page">
        <header class="nw-header">
            <div>
                <h1 class="nw-title">Profile</h1>
                <p class="nw-subtitle">Who someone is and what they're into. Networks have their own tab.</p>
            </div>
            <div class="nw-controls">
            </div>
        </header>

        <div class="nw-banner" id="profile-banner" role="alert" hidden>
            <span id="profile-banner-text"></span>
            <button type="button" class="page-button" id="profile-retry">Retry</button>
        </div>

        <div id="profile-root" aria-live="polite">
            <noscript><p class="page-message">The profile page needs JavaScript turned on.</p></noscript>
        </div>
    </main>
</body>
</html>
